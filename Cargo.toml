[package]
name = "riff"
version = "1.0.0"
edition = "2021"
description = "Riff — a local music player for macOS"
license = "MIT"

[dependencies]
tao = "0.37"
wry = "0.57"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
