<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Riff</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="titlebar" id="titlebar">
    <span class="tb-title">RIFF</span>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="brand-name">riff<span class="brand-dot">.</span></div>
      </div>

      <nav class="nav">
        <button class="nav-item" data-nav="library">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18V5l11-2v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="nav.library">Library</span>
        </button>
        <button class="nav-item" data-nav="downloads">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="nav.downloads">Downloads</span>
        </button>
      </nav>

      <div class="playlists-head">
        <span data-i18n="nav.playlists">Playlists</span>
        <button class="mini-btn" id="new-playlist" title="New playlist" aria-label="New playlist">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="playlist-list" id="playlist-list"></div>

      <div class="sidebar-footer">
        <button class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9c.18.4.56.74 1.03.87H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.13Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="nav.settings">Settings</span>
        </button>
        <button class="nav-item language-btn" id="language-btn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.4 2.6 3.6 5.6 3.6 9S14.4 18.4 12 21c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3Z" stroke="currentColor" stroke-width="1.6"/></svg>
          <span id="language-label">English</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="sidebar-version" id="sidebar-version">Riff</div>
      </div>
    </aside>

    <main class="main" id="main">
      <div id="view">
        <div class="skeleton-head">
          <div class="sk-line sk-eyebrow"></div>
          <div class="sk-line sk-title"></div>
          <div class="sk-line sk-sub"></div>
        </div>
        <div class="skeleton-cards">
          <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
        </div>
        <div class="skeleton-list"></div>
      </div>
    </main>
  </div>

  <footer class="player" id="player">
    <div class="seek-wrap">
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" dir="ltr">
    </div>
    <div class="player-inner">
      <div class="now">
        <div class="now-cover" id="now-cover">
          <div class="now-art" id="now-art">
            <span class="art-letter" id="now-initial">♪</span>
            <img id="now-cover-img" alt="">
          </div>
          <div class="now-eq" id="now-eq"><span></span><span></span><span></span></div>
        </div>
        <div class="now-meta">
          <div class="now-title" id="now-title" dir="auto">Nothing playing</div>
          <div class="now-artist" id="now-artist" dir="auto">Pick a song to start</div>
        </div>
      </div>

      <div class="transport" dir="ltr">
        <button class="icon-btn" id="btn-shuffle" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none"><path d="M17 3l3.5 3.5L17 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 6.5h3.2c1.4 0 2.7.6 3.6 1.8l4.9 7.4c.9 1.2 2.2 1.8 3.6 1.8h1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 14l3.5 3.5L17 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 18h3.2c1.4 0 2.7-.6 3.6-1.8l1.2-1.8M17 6.5h1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-prev" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M19 5.5v13L8.5 12 19 5.5Z" fill="currentColor"/><rect x="4.5" y="5" width="2" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="play-btn" id="btn-play" title="Play" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8.5 5.2c0-.8.9-1.3 1.6-.9l8.6 5.9c.7.5.7 1.5 0 2l-8.6 5.9c-.7.4-1.6-.1-1.6-.9V5.2Z" fill="currentColor"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6.5" y="4.5" width="3.6" height="15" rx="1.4" fill="currentColor"/><rect x="13.9" y="4.5" width="3.6" height="15" rx="1.4" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-next" title="Next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M5 5.5v13L15.5 12 5 5.5Z" fill="currentColor"/><rect x="17.5" y="5" width="2" height="14" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn repeat" id="btn-repeat" title="Repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none"><path d="M17 2.5 20.5 6 17 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 11.5V10a4 4 0 0 1 4-4h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 21.5 3.5 18 7 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 12.5V14a4 4 0 0 1-4 4h-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="player-right">
        <div class="time" dir="ltr"><span id="time-current">0:00</span><span class="time-sep">/</span><span id="time-total">0:00</span></div>
        <button class="icon-btn" id="btn-mute" title="Mute" aria-label="Mute">
          <svg class="vol-on" viewBox="0 0 24 24" fill="none"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg class="vol-off" viewBox="0 0 24 24" fill="none"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m16 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <input class="volume" id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" dir="ltr">
      </div>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div class="drop-hint" id="drop-hint">
    <div class="drop-card">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Drop to add music</span>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
